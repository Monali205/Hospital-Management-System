<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Hospital Management System</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container-fluid">
        <!-- Sidebar Navigation -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-hospital"></i> HMS</h2>
                <button title="Toggle Sidebar" class="toggle-btn" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="patients.html"><i class="fas fa-users"></i> Patients</a></li>
                <li><a href="doctors.html"><i class="fas fa-user-md"></i> Doctors</a></li>
                <li><a href="medicines.html"><i class="fas fa-pills"></i> Medicines</a></li>
                <li><a href="pharmacy.html"><i class="fas fa-prescription-bottle"></i> Pharmacy</a></li>
                <li><a href="laboratory.html"><i class="fas fa-flask"></i> Laboratory</a></li>
                <li><a href="billing.html"><i class="fas fa-receipt"></i> Billing</a></li>
                <li><a href="settings.html" class="active"><i class="fas fa-cog"></i> Settings</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <button class=\"hamburger-btn\" id=\"hamburgerBtn\" title=\"Toggle Menu\">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                    <h1>Settings</h1>
                </div>
            </header>

            <!-- Content Section -->
            <section class="content-section">
                <div class="settings-card">
                    <h2>System Settings</h2>
                    <div class="settings-content">
                        <div class="settings-group">
                            <h3>API Configuration</h3>
                            <p>Backend URL: <code>http://localhost:5000</code></p>
                            <button type="button" class="btn btn-primary" onclick="testConnection()">Test Connection</button>
                        </div>
                        <div class="settings-group">
                            <h3>Application Info</h3>
                            <p>Version: 1.0.0</p>
                            <p>Last Updated: February 15, 2026</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/menu.js"></script>
    <script>
        async function testConnection() {
            try {
                const response = await fetch('http://localhost:5000/api/health');
                if (response.ok) {
                    showAlert('Backend connection successful!', 'success');
                } else {
                    showAlert('Backend is not responding', 'error');
                }
            } catch (error) {
                showAlert('Cannot connect to backend. Make sure it\'s running on port 5000', 'error');
            }
        }
    </script>
</body>
</html>
