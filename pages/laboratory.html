<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratory - Hospital Management System</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container-fluid">
        <!-- Sidebar Navigation -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-hospital"></i> HMS</h2>
                <button title="Toggle Sidebar" class="toggle-btn" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="patients.html"><i class="fas fa-users"></i> Patients</a></li>
                <li><a href="doctors.html"><i class="fas fa-user-md"></i> Doctors</a></li>
                <li><a href="medicines.html"><i class="fas fa-pills"></i> Medicines</a></li>
                <li><a href="pharmacy.html"><i class="fas fa-prescription-bottle"></i> Pharmacy</a></li>
                <li><a href="laboratory.html" class="active"><i class="fas fa-flask"></i> Laboratory</a></li>
                <li><a href="billing.html"><i class="fas fa-receipt"></i> Billing</a></li>
                <li><a href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <button class="hamburger-btn" id="hamburgerBtn" title="Toggle Menu">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                    <h1>Laboratory Management</h1>
                </div>
                <div class="header-right">
                    <button class="btn btn-primary" id="addLabTestBtn">
                        <i class="fas fa-plus"></i> Add Lab Test
                    </button>
                </div>
            </header>

            <!-- Content Section -->
            <section class="content-section">
                <!-- Tabs -->
                <div class="tabs">
                    <button class="tab-btn active" data-tab="tests">Lab Tests</button>
                    <button class="tab-btn" data-tab="reports">Lab Reports</button>
                </div>

                <!-- Lab Tests Tab -->
                <div class="tab-content active" id="tests-tab">
                    <div class="filters-bar">
                        <input type="text" id="searchLabTest" placeholder="Search lab tests..." class="search-input">
                        <select title="Filter by Category" id="categoryFilter" class="filter-select">
                            <option value="">All Categories</option>
                            <option value="Blood Test">Blood Test</option>
                            <option value="X-Ray">X-Ray</option>
                            <option value="Ultrasound">Ultrasound</option>
                        </select>
                    </div>

                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Test Name</th>
                                    <th>Code</th>
                                    <th>Category</th>
                                    <th>Cost</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="testsList">
                                <tr>
                                    <td colspan="6" class="text-center">Loading lab tests...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Lab Reports Tab -->
                <div class="tab-content" id="reports-tab">
                    <div class="filters-bar">
                        <input type="text" id="searchLabReport" placeholder="Search lab reports..." class="search-input">
                        <select title="Filter by Report Status" id="reportStatusFilter" class="filter-select">
                            <option value="">All Status</option>
                            <option value="Pending">Pending</option>
                            <option value="Completed">Completed</option>
                            <option value="Approved">Approved</option>
                        </select>
                    </div>

                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Report #</th>
                                    <th>Patient</th>
                                    <th>Test Name</th>
                                    <th>Date</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="reportsList">
                                <tr>
                                    <td colspan="6" class="text-center">Loading lab reports...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Add Lab Test Modal -->
    <div class="modal" id="labTestModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add Lab Test</h2>
                <button class="close-btn" id="closeLabTestModal">&times;</button>
            </div>
            <form id="labTestForm" class="lab-test-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="testName">Test Name *</label>
                        <input type="text" id="testName" required>
                    </div>
                    <div class="form-group">
                        <label for="testCode">Test Code *</label>
                        <input type="text" id="testCode" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Category *</label>
                        <select id="category" required>
                            <option value="">Select Category</option>
                            <option value="Blood Test">Blood Test</option>
                            <option value="X-Ray">X-Ray</option>
                            <option value="Ultrasound">Ultrasound</option>
                            <option value="COVID-19">COVID-19</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="cost">Cost *</label>
                        <input type="number" id="cost" step="0.01" required>
                    </div>
                    <div class="form-group form-group-full">
                        <label for="description">Description</label>
                        <textarea id="description"></textarea>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelLabTestBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Lab Test</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/laboratory.js"></script>
    <script src="../js/menu.js"></script>
</body>
</html>
